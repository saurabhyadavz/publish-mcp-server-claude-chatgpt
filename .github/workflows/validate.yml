name: validate
on:
  push:
  pull_request:
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Skills and manifests
        run: python3 scripts/validate_skills.py
      - name: Scripts compile
        run: python3 -m py_compile skills/*/scripts/*.py scripts/*.py
